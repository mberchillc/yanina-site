<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pendientes | Yanina Trainer</title>
  <style>
    :root{--green-dark:#183f35;--green-main:#7ec845;--green-mid:#6ea313;--green-soft:#d9f2cb;--cream:#f7f3ea;--white:#fff;--text:#24332e;--navy:#18223d;--muted:#6f7d78;--border:rgba(24,63,53,.14);--shadow:0 18px 50px rgba(24,63,53,.12);--radius:22px}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--cream),#eef7ea);color:var(--text);min-height:100vh}.shell{max-width:1180px;margin:0 auto;padding:24px}.top{background:var(--green-dark);color:#fff;border-radius:24px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:var(--shadow);margin-bottom:26px}.brand{display:flex;align-items:center;gap:18px}.brand img{width:300px;height:100px;object-fit:cover;object-position:center;display:block}.brand h1{font-size:22px;color:#fff;line-height:1.05}.brand p{color:rgba(255,255,255,.72);font-size:13px;margin-top:4px}.btn{border:0;border-radius:999px;padding:11px 16px;font-size:13px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;line-height:1.1}.btn-soft{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.24);box-shadow:none}.btn-dark{background:var(--green-dark);color:#fff}.btn-paid{background:var(--green-mid);color:#fff}.btn-paid.paid{background:var(--green-dark)}.btn:disabled{opacity:.7;cursor:not-allowed}.summary-panel{background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;overflow:hidden}.summary-hero{position:relative;height:230px;border-radius:26px;overflow:hidden;background:#eef5df;margin-bottom:20px}.summary-hero img.hero-photo{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}.summary-hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(0deg,rgba(255,255,255,.94),rgba(255,255,255,0));pointer-events:none}.summary-logo{display:none}.summary-center{text-align:center;margin-bottom:18px}.month-pill{display:inline-flex;align-items:center;justify-content:center;background:#eef5df;color:var(--green-mid);border-radius:999px;padding:8px 18px;font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}.student-name{font-size:34px;line-height:1.08;color:var(--navy);font-weight:900;margin-bottom:8px}.modality-pill{display:inline-flex;align-items:center;gap:7px;background:#eef5df;color:#4a5a46;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px}.summary-message{margin:18px 0;background:linear-gradient(135deg,#f6fbef,#fff);border:1px solid rgba(126,200,69,.18);border-radius:20px;padding:18px;text-align:center}.summary-message strong{display:block;color:var(--green-dark);font-size:22px;font-weight:900;margin-bottom:4px}.summary-message em{display:block;color:var(--green-mid);font-family:"Brush Script MT","Segoe Script",cursive;font-size:30px;font-weight:400;line-height:1.15}.summary-cards{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:14px;margin:18px 0}.summary-card{background:#fff;border:1px solid rgba(24,63,53,.08);border-radius:22px;padding:20px;text-align:center;box-shadow:0 14px 38px rgba(24,63,53,.08)}.summary-card small{display:block;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}.summary-card strong{display:block;color:var(--navy);font-size:40px;line-height:1}.summary-card span{display:block;color:var(--green-mid);font-size:14px;font-weight:900;margin-top:8px}.summary-card.total{background:linear-gradient(135deg,#88b313,#6ea313);display:flex;flex-direction:column;justify-content:center}.summary-card.total small,.summary-card.total strong,.summary-card.total span{color:#fff}.summary-card.total strong{font-size:46px}.summary-bottom{display:grid;grid-template-columns:1.08fr .92fr;gap:14px}.visual-calendar,.detail-card{background:#fff;border:1px solid rgba(24,63,53,.08);border-radius:22px;padding:20px;box-shadow:0 14px 38px rgba(24,63,53,.08)}.section-title{color:var(--navy);font-weight:900;font-size:18px;margin-bottom:14px}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.weekday{color:var(--muted);font-size:12px;font-weight:900;text-align:center}.day{height:33px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--text)}.day.outside{opacity:.28}.day.has-class{background:var(--green-mid);color:#fff;border-radius:50%;width:33px;height:33px;margin:0 auto}.legend{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:9px;color:#505b57;font-size:13px}.legend-dot{width:11px;height:11px;border-radius:50%;background:var(--green-mid)}.detail-list{display:grid;gap:10px}.detail-row{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#f3f8e9;border-radius:15px;padding:13px 14px}.detail-row span{color:var(--muted);font-size:13px;font-weight:900}.detail-row strong{color:var(--green-mid);font-size:22px}.detail-row.total-line{background:var(--green-mid)}.detail-row.total-line span,.detail-row.total-line strong{color:#fff}.payment-bar{margin-top:16px;background:#fff;border:1px solid rgba(24,63,53,.08);border-radius:22px;padding:18px 20px;box-shadow:0 14px 38px rgba(24,63,53,.08);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.status{font-weight:900;color:var(--green-mid);font-size:18px}.status.paid{color:var(--green-dark)}.muted{color:var(--muted);font-size:14px;margin-top:4px}.empty{background:#fff;border:1px solid var(--border);border-radius:22px;padding:22px;color:var(--muted);box-shadow:var(--shadow)}@media(max-width:760px){.shell{padding:16px}.top{align-items:stretch;flex-direction:column;padding:22px 24px;gap:14px}.brand{width:100%;display:grid;grid-template-columns:115px 1fr;gap:18px;align-items:center}.brand img{width:115px;height:74px;object-fit:cover;object-position:center}.brand h1{font-size:20px;line-height:1.05}.brand p{font-size:13px}.btn-soft{align-self:flex-start}.summary-cards,.summary-bottom{grid-template-columns:1fr}.summary-hero{height:220px}.summary-logo{width:145px}.student-name{font-size:28px}.summary-message em{font-size:26px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><img src="../assets/logo-transp.png" alt="Yanina Trainer"><div><h1>Plataforma Yanina Trainer</h1><p>Resumen mensual</p></div></div><a class="btn btn-soft" id="backLink" href="index.html">Volver</a></header>
    <section id="app"><div class="empty">Cargando resumen pendiente...</div></section>
  </main>
  <script>
    const API_BASE='https://yanina-trainer-api.mberchillc.workers.dev';
    const params=new URLSearchParams(location.search),adminPreview=params.get('adminPreview')==='1';
    const studentSessionData=JSON.parse(localStorage.getItem('yaninaStudentSession')||'{}'),adminSessionData=JSON.parse(localStorage.getItem('yaninaAdminSession')||'{}');
    const sessionData=adminPreview?adminSessionData:studentSessionData,requestedStudentId=String(params.get('id')||params.get('studentId')||'');
    const STUDENT_ID=String(adminPreview?requestedStudentId:(studentSessionData.studentId||''));
    if(!sessionData.token||!STUDENT_ID){window.location.replace('../login.html');throw new Error('AUTH_REQUIRED')}
    const originalFetch=window.fetch.bind(window);
    window.fetch=(input,init={})=>{const url=typeof input==='string'?input:input?.url||'';if(String(url).startsWith(API_BASE)){const headers=new Headers(init.headers||{});headers.set('Authorization',`Bearer ${sessionData.token}`);return originalFetch(input,{...init,headers})}return originalFetch(input,init)};
    const MONTH=String(params.get('month')||new Date().toISOString().slice(0,7));
    const $=id=>document.getElementById(id);let currentSummary=null,currentStudent=null;
    function money(v){const n=Number(v||0);return `$${Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:0}):'0'}`}
    function monthLabel(value){const [y,m]=String(value).split('-').map(Number);const d=new Date(y,m-1,1);return d.toLocaleDateString('es-US',{month:'long',year:'numeric'}).toUpperCase()}
    function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function normalizeSummary(s){if(!s)return null;let dates=[];try{dates=Array.isArray(s.class_dates)?s.class_dates:JSON.parse(s.class_dates||'[]')}catch(_){dates=[]}return{...s,classes:s.classes_count??s.classes??0,classValue:s.class_value??s.classValue??0,other:s.other_value??s.other??0,total:s.total_value??s.total??0,classDates:dates}}
    function renderCalendar(month,dates){const [y,m]=String(month).split('-').map(Number),st=new Date(y,m-1,1),en=new Date(y,m,0),set=new Set(dates||[]),week=['Lu','Ma','Mi','Ju','Vi','Sa','Do'],first=(st.getDay()+6)%7,vis=addD(st,-first);let html=`<div class="month-grid">${week.map(d=>`<div class="weekday">${d}</div>`).join('')}`;for(let i=0;i<42;i++){const d=addD(vis,i),k=iso(d),out=d<st||d>en;html+=`<div class="day ${out?'outside':''} ${set.has(k)?'has-class':''}">${d.getDate()}</div>`}return html+'</div>'}
    function render(summary){currentSummary=normalizeSummary(summary);if(!currentSummary){$('app').innerHTML='<div class="empty">No hay resumen pendiente cargado para este mes.</div>';return}const paid=currentSummary.status==='paid',name=currentStudent?.full_name||currentStudent?.name||'Alumna',modality=currentStudent?.modality||'Presencial';$('app').innerHTML=`<section class="summary-panel"><div class="summary-hero"><img class="hero-photo" src="../assets/Yani-pasto.png" alt="Yanina"><img class="summary-logo" src="../assets/logo-transp.png" alt="Yanina Trainer"></div><div class="summary-center"><div class="month-pill">${monthLabel(MONTH)}</div><div class="student-name">${name}</div><div class="modality-pill">📍 ${modality}</div></div><div class="summary-message"><strong>Gracias por entrenar conmigo</strong><em>Entrenás el cuerpo para mejorar tu vida</em></div><div class="summary-cards"><div class="summary-card"><small>Clases a realizar</small><strong>${currentSummary.classes}</strong><span>este mes</span></div><div class="summary-card"><small>Valor por clase</small><strong>${money(currentSummary.classValue)}</strong></div><div class="summary-card total"><small>Total mensual</small><strong>${money(currentSummary.total)}</strong><span>${paid?'pagado':'pendiente'}</span></div></div><div class="summary-bottom"><div class="visual-calendar"><div class="section-title">Calendario de entrenamientos</div>${renderCalendar(MONTH,currentSummary.classDates)}<div class="legend"><span class="legend-dot"></span><span>Días con entrenamiento</span></div></div><div class="detail-card"><div class="section-title">Resumen mensual</div><div class="detail-list"><div class="detail-row"><span>Clases</span><strong>${currentSummary.classes}</strong></div><div class="detail-row"><span>Valor por clase</span><strong>${money(currentSummary.classValue)}</strong></div><div class="detail-row"><span>Otros</span><strong>${money(currentSummary.other)}</strong></div><div class="detail-row total-line"><span>Total mensual</span><strong>${money(currentSummary.total)}</strong></div></div></div></div><div class="payment-bar"><div><div class="status ${paid?'paid':''}">${paid?'Pagado':'Pendiente de pago'}</div><div class="muted">El botón confirma el pago realizado.</div></div><button type="button" class="btn btn-paid ${paid?'paid':''}" id="paidBtn" ${paid?'disabled':''}>${paid?'Pagado':'Pago realizado'}</button></div></section>`;const b=$('paidBtn');if(b)b.addEventListener('click',markPaid)}
    async function load(){if(!STUDENT_ID){render(null);return}$('backLink').href=adminPreview?`../admin/historial-pagos.html?id=${encodeURIComponent(STUDENT_ID)}`:`index.html?id=${encodeURIComponent(STUDENT_ID)}`;try{const [studentRes,summaryRes]=await Promise.all([fetch(`${API_BASE}/api/students/${encodeURIComponent(STUDENT_ID)}?cache=${Date.now()}`),fetch(`${API_BASE}/api/students/${encodeURIComponent(STUDENT_ID)}/payment-summary?month=${encodeURIComponent(MONTH)}&cache=${Date.now()}`)]);if(!studentRes.ok||!summaryRes.ok)throw new Error('PAYMENT_SUMMARY_LOAD_FAILED');currentStudent=await studentRes.json();const summary=await summaryRes.json();render(summary)}catch(e){console.error(e);$('app').innerHTML='<div class="empty">No se pudo cargar el resumen pendiente.</div>'}}
    async function markPaid(){if(!currentSummary?.id)return;const b=$('paidBtn');try{b.disabled=true;b.textContent='Confirmando...';const r=await fetch(`${API_BASE}/api/payment-summaries/${encodeURIComponent(currentSummary.id)}/paid`,{method:'POST'});if(!r.ok)throw new Error('No se pudo marcar el pago.');const updated=await r.json();render({...currentSummary,...updated})}catch(e){console.error(e);alert(e.message||'No se pudo marcar el pago.');render(currentSummary)}}
    load();
  </script>
</body>
</html>
