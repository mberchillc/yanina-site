name: Codex export current main

on:
  push:
    branches:
      - codex/appointments-training-page-20260720
    paths:
      - .github/workflows/codex-export-current-main.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/codex-export-current-main.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Create source archive
        run: tar --exclude=.git -czf "$RUNNER_TEMP/yanina-main-source.tgz" .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: yanina-main-source
          path: ${{ runner.temp }}/yanina-main-source.tgz
          if-no-files-found: error
          retention-days: 1
