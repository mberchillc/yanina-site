name: Verify final appointment and training production deployment

on:
  push:
    branches:
      - main
    paths:
      - verify-final-production-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-final-appointment-training-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Cloudflare and verify exact production artifacts
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          expected_profile='321e7f1754a5c56d00ab0db637adaa4a1a8d0fc13a70a7ec6b5d3e2c64fd1d98'
          expected_training='90e8450f0d158dd11cb1b8dc3292cbf47ac1cc357096edf28d923a8aeabbd632'
          : > /tmp/production-verification.log

          for attempt in $(seq 1 36); do
            stamp="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            profile_url="https://yaninatrainer.net/admin/alumno.html?verify=${stamp}"
            training_url="https://yaninatrainer.net/admin/entrenamiento.html?verify=${stamp}"

            profile_code=$(curl -sS -L --connect-timeout 15 --max-time 30 \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              -H 'Pragma: no-cache' \
              -o /tmp/live-alumno.html -w '%{http_code}' "$profile_url" || true)
            training_code=$(curl -sS -L --connect-timeout 15 --max-time 30 \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              -H 'Pragma: no-cache' \
              -o /tmp/live-entrenamiento.html -w '%{http_code}' "$training_url" || true)

            profile_hash=$(sha256sum /tmp/live-alumno.html 2>/dev/null | awk '{print $1}' || true)
            training_hash=$(sha256sum /tmp/live-entrenamiento.html 2>/dev/null | awk '{print $1}' || true)

            printf 'attempt=%s profile_http=%s profile_sha256=%s training_http=%s training_sha256=%s\n' \
              "$attempt" "$profile_code" "$profile_hash" "$training_code" "$training_hash" | tee -a /tmp/production-verification.log

            if [ "$profile_code" = '200' ] && [ "$training_code" = '200' ] && \
               [ "$profile_hash" = "$expected_profile" ] && [ "$training_hash" = "$expected_training" ]; then
              grep -q '<body class="student-profile-page">' /tmp/live-alumno.html
              grep -q 'id="appointmentModal"' /tmp/live-alumno.html
              grep -q 'Hora (hh.mm)' /tmp/live-alumno.html
              grep -q 'id="saveAppointmentBtn">Guardar<' /tmp/live-alumno.html
              grep -q 'id="editAppointmentBtn">Editar<' /tmp/live-alumno.html
              grep -q 'id="deleteAppointmentBtn"' /tmp/live-alumno.html
              grep -q '<body class="training-page no-training-selection">' /tmp/live-entrenamiento.html
              grep -q 'id="editSelectedAppointmentLink"' /tmp/live-entrenamiento.html
              grep -q 'id="classVideosAdmin"' /tmp/live-entrenamiento.html
              grep -q 'id="classCommentsAdmin"' /tmp/live-entrenamiento.html
              echo "verified_attempt=${attempt}" >> /tmp/production-verification.log
              exit 0
            fi

            sleep 10
          done

          echo 'Production did not reach the exact validated artifacts within the retry window.' >&2
          exit 1

      - name: Record PASS and remove temporary verifier
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          {
            echo 'result=PASS'
            echo "source_commit=8694c8f425a46bd398ffbc6dfb3d2dc87732f303"
            echo 'profile_url=https://yaninatrainer.net/admin/alumno.html'
            echo 'profile_sha256=321e7f1754a5c56d00ab0db637adaa4a1a8d0fc13a70a7ec6b5d3e2c64fd1d98'
            echo 'training_url=https://yaninatrainer.net/admin/entrenamiento.html'
            echo 'training_sha256=90e8450f0d158dd11cb1b8dc3292cbf47ac1cc357096edf28d923a8aeabbd632'
            echo "verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            cat /tmp/production-verification.log
          } > scripts/final_production_validation_status.txt
          rm -f .github/workflows/verify-final-production.yml
          rm -f verify-final-production-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record final production appointment and training verification'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Record production verification failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          mkdir -p scripts
          {
            echo 'result=FAIL'
            echo "source_commit=8694c8f425a46bd398ffbc6dfb3d2dc87732f303"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "recorded_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            cat /tmp/production-verification.log 2>/dev/null || true
          } > scripts/final_production_validation_status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/final_production_validation_status.txt
          git commit -m 'Record final production appointment and training verification failure'
          git push origin HEAD:${GITHUB_REF_NAME}
