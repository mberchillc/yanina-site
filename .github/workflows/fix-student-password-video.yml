name: Fix student password setup and video viewing

on:
  push:
    paths:
      - .github/workflows/fix-student-password-video.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch password setup and admin video opening
        run: |
          python - <<'PY'
          from pathlib import Path

          login = Path('alumno/login.html')
          text = login.read_text(encoding='utf-8')
          text = text.replace(
              'async function setupPassword(username, password, setupCode) {\n      await postJson("/api/student-auth/setup-password", { username, password, setup_code: setupCode });\n      showSuccess("Contraseña creada. Ya podés entrar.");\n      setMode("login");\n    }',
              'async function setupPassword(username, password, setupCode) {\n      const data = await postJson("/api/student-auth/setup-password", { username, password, setup_code: setupCode });\n      showSuccess("Contraseña creada. Ingresando a tu espacio...");\n      createSession(data, username);\n    }'
          )
          text = text.replace(
              'showError("La contraseña nueva debe ser alfanumérica y tener al menos 6 caracteres.");',
              'showError("La contraseña nueva debe tener al menos 6 caracteres y usar solo letras y números.");'
          )
          marker = '        if (code === "SETUP_CODE_REQUIRED" || code === "INVALID_SETUP_CODE") {\n          showError("El codigo no corresponde a ese usuario. Revisa los datos que te dio Yanina.");\n          return;\n        }'
          insert = marker + '\n\n        if (code === "PASSWORD_RULE_INVALID") {\n          showError("La contraseña nueva debe tener al menos 6 caracteres y usar solo letras y números.");\n          return;\n        }'
          if 'PASSWORD_RULE_INVALID' not in text:
              text = text.replace(marker, insert)
          login.write_text(text, encoding='utf-8')

          admin = Path('admin/alumno.html')
          text = admin.read_text(encoding='utf-8')
          if 'function openAdminStudentVideo' not in text:
              helper = '''\nasync function openAdminStudentVideo(videoId, button) {\n  if (!videoId) return;\n\n  const originalText = button ? button.textContent : "";\n  if (button) {\n    button.disabled = true;\n    button.textContent = "Abriendo...";\n  }\n\n  try {\n    const response = await fetch(`${API_BASE}/api/student-videos/${encodeURIComponent(videoId)}/file`);\n    if (!response.ok) {\n      const error = await response.json().catch(() => ({}));\n      throw new Error(error.error || "No se pudo abrir el video.");\n    }\n\n    const blob = await response.blob();\n    const objectUrl = URL.createObjectURL(blob);\n    window.open(objectUrl, "_blank", "noopener");\n    setTimeout(() => URL.revokeObjectURL(objectUrl), 60 * 1000);\n  } catch (error) {\n    console.error(error);\n    alert(error.message || "No se pudo abrir el video.");\n  } finally {\n    if (button) {\n      button.disabled = false;\n      button.textContent = originalText || "Ver video";\n    }\n  }\n}\n'''
              text = text.replace('\nasync function renderAdminClassVideos(classId) {', helper + '\nasync function renderAdminClassVideos(classId) {')
          text = text.replace('''            <a\n              class="btn btn-form-secondary"\n              href="${API_BASE}/api/student-videos/${encodeURIComponent(video.id)}/file"\n              target="_blank"\n            >\n              Ver video\n            </a>''', '''            <button\n              type="button"\n              class="btn btn-form-secondary"\n              data-video-id="${escapeHtml(video.id)}"\n            >\n              Ver video\n            </button>''')
          listener = '''\n    box.querySelectorAll("[data-video-id]").forEach(button => {\n      button.addEventListener("click", () => openAdminStudentVideo(button.dataset.videoId, button));\n    });\n'''
          if 'data-video-id' in text and 'openAdminStudentVideo(button.dataset.videoId, button)' not in text:
              text = text.replace('\n    box.querySelectorAll(".mark-video-reviewed-btn").forEach(button => {', listener + '\n    box.querySelectorAll(".mark-video-reviewed-btn").forEach(button => {')
          admin.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched pages
        run: |
          if git diff --quiet; then
            echo "No page changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alumno/login.html admin/alumno.html
          git commit -m "Fix student password setup and admin video viewing"
          git push
