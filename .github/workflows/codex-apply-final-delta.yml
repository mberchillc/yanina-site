name: Apply final appointment calendar refinements

on:
  push:
    branches:
      - codex/appointments-training-page-20260720
    paths:
      - .github/workflows/codex-apply-final-delta.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and apply refinements
        shell: bash
        run: |
          base64 --decode .github/codex-final-delta.b64 > "$RUNNER_TEMP/yanina-final-delta.patch.xz"
          echo "b672e8087f766dcc0681a56a8bbdfdedc615ff39fb7536d29bc5ec762485f68b  $RUNNER_TEMP/yanina-final-delta.patch.xz" | sha256sum -c -
          xz --decompress --stdout "$RUNNER_TEMP/yanina-final-delta.patch.xz" > "$RUNNER_TEMP/yanina-final-delta.patch"
          git apply --check "$RUNNER_TEMP/yanina-final-delta.patch"
          git apply "$RUNNER_TEMP/yanina-final-delta.patch"
          rm -f .github/codex-final-delta.b64
          rm -f .github/workflows/codex-apply-final-delta.yml
      - name: Commit refinements
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize appointment calendar and training page"
          git push
