name: Apply appointment calendar implementation

on:
  push:
    branches:
      - codex/appointments-training-page-20260720
    paths:
      - .github/workflows/codex-export-repository.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and apply implementation
        shell: bash
        run: |
          cat .github/codex-payload-*.b64 | base64 --decode > "$RUNNER_TEMP/yanina.patch.xz"
          echo "0231eca509277e59f33ea9558836ef3b291f82010bfce238b2cb5292ecf752f8  $RUNNER_TEMP/yanina.patch.xz" | sha256sum -c -
          xz --decompress --stdout "$RUNNER_TEMP/yanina.patch.xz" > "$RUNNER_TEMP/yanina.patch"
          git apply --check "$RUNNER_TEMP/yanina.patch"
          git apply "$RUNNER_TEMP/yanina.patch"
          rm -f .github/codex-payload-*.b64
          rm -f .github/workflows/codex-export-repository.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement appointment calendar and training page"
          git push
