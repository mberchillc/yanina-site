name: Patch payment polish

on:
  push:
    paths:
      - patch-payment-polish-trigger.txt
      - .github/workflows/patch-payment-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch payment UI
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Pago page: same topbar size as admin
          p = Path('alumno/pago.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('.shell{max-width:900px;margin:0 auto;padding:22px}', '.shell{max-width:1180px;margin:0 auto;padding:24px}')
          text = text.replace('.top{background:var(--green-dark);color:#fff;border-radius:24px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:var(--shadow);margin-bottom:26px}.brand{display:flex;align-items:center;gap:18px}.brand img{width:250px;max-width:42vw;height:auto;display:block}', '.top{background:var(--green-dark);color:#fff;border-radius:24px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:var(--shadow);margin-bottom:26px}.brand{display:flex;align-items:center;gap:18px}.brand img{width:300px;height:100px;object-fit:cover;object-position:center;display:block}')
          text = text.replace('@media(max-width:760px){.shell{padding:14px}.top{align-items:flex-start;flex-direction:column}.brand img{width:220px;max-width:72vw}', '@media(max-width:760px){.shell{padding:16px}.top{align-items:flex-start;flex-direction:column}.brand img{width:240px;height:86px}')
          p.write_text(text, encoding='utf-8')

          # 2) Student home: pending and no-pending button colors
          p = Path('alumno/index.html')
          text = p.read_text(encoding='utf-8')
          if '.tab-btn.no-pending' not in text:
              text = text.replace('.tab-btn.pending-alert{background:#f4f6df;color:var(--green-dark);border-color:#dfe8c7;box-shadow:0 12px 26px rgba(115,173,19,.10)}', '.tab-btn.pending-alert{background:#f4f6df;color:var(--green-dark);border-color:#dfe8c7;box-shadow:0 12px 26px rgba(115,173,19,.10)}.tab-btn.no-pending{background:#eef8f6;color:#173f35;border-color:#d7ebe6;box-shadow:0 10px 22px rgba(23,63,53,.06)}')
          old_js = "btn.textContent=pending?'Pendientes':'Sin pendientes';btn.classList.toggle('pending-alert',!!pending)"
          new_js = "btn.textContent=pending?'Pendientes':'Sin pendientes';btn.classList.toggle('pending-alert',!!pending);btn.classList.toggle('no-pending',!pending)"
          text = text.replace(old_js, new_js)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes"
          else
            git add alumno/pago.html alumno/index.html
            git commit -m "Match payment header and pending nav colors"
            git push
          fi
