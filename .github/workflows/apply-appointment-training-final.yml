name: Apply final appointment and training implementation

on:
  push:
    branches:
      - main
    paths:
      - appointment-training-final-trigger.txt
      - .github/workflows/apply-appointment-training-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-appointment-training-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore validated source baseline and apply exact implementation delta
        shell: bash
        run: |
          set -euo pipefail
          echo restore-and-apply > /tmp/final-appointment-training-phase
          git checkout 77ff9a0541c5ddd4acfa80413b66e8291e3bdd9d -- \
            admin/alumno.html \
            admin/entrenamiento.html \
            functions/admin/alumno.html.js \
            'functions/admin/[[path]].js'
          test "$(git hash-object admin/alumno.html)" = 'd804148d72c53073d820503c6690b355612235ec'
          test "$(git hash-object admin/entrenamiento.html)" = 'a01e352601031a5f2aeeb22b7b6a4a496b0544cf'
          test "$(git hash-object functions/admin/alumno.html.js)" = '8bb1b92016234a91ac9c206499d8d41dfa8aee82'
          test "$(git hash-object 'functions/admin/[[path]].js')" = '734127a218c4dcf67b18a2bfe88db860f63e08b9'

          cat .github/appointment-training-final/chunk-*.txt > /tmp/current-to-feature.patch.xz.b64
          printf '%s  %s\n' '3c6b56ca03ec5f54d9deb1056f4e2c97478e7826eac56386344c46394ef8b2bf' /tmp/current-to-feature.patch.xz.b64 | sha256sum -c -
          base64 -d /tmp/current-to-feature.patch.xz.b64 > /tmp/current-to-feature.patch.xz
          printf '%s  %s\n' '7865c19e8734851110978c0b12e1d5efcbc131a23f21417bca5fbad2ecfe10b6' /tmp/current-to-feature.patch.xz | sha256sum -c -
          xz -dc /tmp/current-to-feature.patch.xz > /tmp/current-to-feature.patch
          printf '%s  %s\n' '28e934bedfd88051ff4df64cad671de77dcda60f6b7926cd79c2f03ea509f588' /tmp/current-to-feature.patch | sha256sum -c -
          patch -p1 --forward --batch < /tmp/current-to-feature.patch

      - name: Validate HTML, JavaScript and exact file contents
        shell: bash
        run: |
          set -euo pipefail
          echo validate-exact-output > /tmp/final-appointment-training-phase
          python - <<'PY'
          from hashlib import sha256
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          expected = {
              'admin/alumno.html': '321e7f1754a5c56d00ab0db637adaa4a1a8d0fc13a70a7ec6b5d3e2c64fd1d98',
              'admin/entrenamiento.html': '90e8450f0d158dd11cb1b8dc3292cbf47ac1cc357096edf28d923a8aeabbd632',
              'functions/admin/alumno.html.js': 'e48cbce5007d1a48c287a91135fe4b4e0231a1a5b23cfd66810194b832995ee0',
              'functions/admin/[[path]].js': 'e48cbce5007d1a48c287a91135fe4b4e0231a1a5b23cfd66810194b832995ee0',
          }
          for path, digest in expected.items():
              data = Path(path).read_bytes()
              actual = sha256(data).hexdigest()
              assert actual == digest, f'{path}: {actual} != {digest}'

          profile = Path('admin/alumno.html').read_text(encoding='utf-8')
          training = Path('admin/entrenamiento.html').read_text(encoding='utf-8')
          assert '<body class="student-profile-page">' in profile
          assert 'id="appointmentModal"' in profile
          assert 'id="appointmentDateInput"' in profile
          assert 'id="appointmentTimeInput"' in profile
          assert 'inputmode="numeric"' in profile
          assert 'placeholder="18.30"' in profile
          assert 'id="appointmentCommentsInput"' in profile
          assert 'id="appointmentSaveBtn">Guardar<' in profile
          assert 'id="appointmentEditBtn">Editar<' in profile
          assert 'id="appointmentDeleteBtn"' in profile
          assert 'entrenamiento.html' in profile
          assert '<body class="training-page no-training-selection">' in training
          assert '<title>Entrenamiento | Yanina Trainer</title>' in training
          assert 'id="editSelectedAppointmentLink"' in training
          assert 'id="classVideosAdmin"' in training
          assert 'id="classCommentsAdmin"' in training

          class Parser(HTMLParser):
              pass
          for name, html in [('profile', profile), ('training', training)]:
              parser = Parser()
              parser.feed(html)
              parser.close()

          profile_scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', profile, flags=re.S | re.I)
          training_scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', training, flags=re.S | re.I)
          assert len(profile_scripts) == 1, len(profile_scripts)
          assert len(training_scripts) == 1, len(training_scripts)
          assert profile_scripts[0] == training_scripts[0]
          Path('/tmp/alumno.js').write_text(profile_scripts[0], encoding='utf-8')
          Path('/tmp/entrenamiento.js').write_text(training_scripts[0], encoding='utf-8')
          print('exact appointment/training implementation validated')
          PY
          node --check /tmp/alumno.js
          node --check /tmp/entrenamiento.js
          node --check 'functions/admin/alumno.html.js'
          node --check 'functions/admin/[[path]].js'
          git diff --check

      - name: Remove one-time installers and commit final implementation
        shell: bash
        run: |
          set -euo pipefail
          echo cleanup-and-push > /tmp/final-appointment-training-phase
          rm -rf .github/appointment-training-final
          rm -f .github/workflows/apply-appointment-training-final.yml
          rm -f appointment-training-final-trigger.txt
          rm -f .github/workflows/patch-appointments-training.yml
          rm -f .github/workflows/verify-live-appointment-training.yml
          rm -f scripts/patch_appointments_training.py
          rm -f scripts/patch_appointments_training_followup.py
          rm -f scripts/patch_appointments_training_final.py
          rm -f scripts/patch_appointment_time_dot_format.py
          rm -f scripts/trigger_appointments_training.txt
          rm -f scripts/trigger_live_appointment_training_check.txt
          rm -f scripts/appointment_validation_status.txt
          rm -f scripts/live_appointment_training_status.txt
          rm -f scripts/final_appointment_training_status.txt
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize appointment calendar and dedicated training page'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Record exact failure phase
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          phase=$(cat /tmp/final-appointment-training-phase 2>/dev/null || echo checkout-or-workflow)
          git reset --hard HEAD
          git clean -fd
          mkdir -p scripts
          {
            echo 'result=FAIL'
            echo "phase=${phase}"
            echo "source_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "recorded_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > scripts/final_appointment_training_status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/final_appointment_training_status.txt
          git commit -m "Record final appointment/training failure at ${phase}"
          git push origin HEAD:${GITHUB_REF_NAME}
