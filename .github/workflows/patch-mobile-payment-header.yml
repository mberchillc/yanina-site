name: Patch mobile payment header

on:
  push:
    paths:
      - patch-mobile-payment-header-trigger.txt
      - .github/workflows/patch-mobile-payment-header.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust mobile header
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('alumno/pago.html')
          text = p.read_text(encoding='utf-8')
          old = '@media(max-width:760px){.shell{padding:16px}.top{align-items:flex-start;flex-direction:column}.brand img{width:240px;height:86px}.summary-cards,.summary-bottom{grid-template-columns:1fr}.summary-hero{height:220px}.summary-logo{width:145px}.student-name{font-size:28px}.summary-message em{font-size:26px}}'
          new = '@media(max-width:760px){.shell{padding:16px}.top{align-items:stretch;flex-direction:column;padding:22px 24px;gap:14px}.brand{width:100%;display:grid;grid-template-columns:115px 1fr;gap:18px;align-items:center}.brand img{width:115px;height:74px;object-fit:cover;object-position:center}.brand h1{font-size:20px;line-height:1.05}.brand p{font-size:13px}.btn-soft{align-self:flex-start}.summary-cards,.summary-bottom{grid-template-columns:1fr}.summary-hero{height:220px}.summary-logo{width:145px}.student-name{font-size:28px}.summary-message em{font-size:26px}}'
          if old not in text:
              raise SystemExit('mobile media block not found')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes"
          else
            git add alumno/pago.html
            git commit -m "Adjust mobile payment header"
            git push
          fi
# trigger run
