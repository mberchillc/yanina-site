name: Patch unified login link

on:
  push:
    paths:
      - 'scripts/patch_unified_login_link.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch platform login link
        run: python scripts/patch_unified_login_link.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plataforma-demo.html
          git commit -m "Point platform account button to unified login"
          git push
