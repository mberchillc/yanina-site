name: Patch admin history and payment visual

on:
  push:
    paths:
      - patch-admin-history-photo-trigger.txt
      - .github/workflows/patch-admin-history-and-photo.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch links and visual details
        run: |
          python - <<'PY'
          from pathlib import Path

          # Gestion administrativa: Historial now opens admin tool, not student-only page
          p = Path('admin/gestion-administrativa.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('historyBtn.href=`../alumno/historial-pagos.html?id=${encodeURIComponent(sid(selectedStudent))}`', 'historyBtn.href=`historial-pagos.html?id=${encodeURIComponent(sid(selectedStudent))}`')
          p.write_text(text, encoding='utf-8')

          # Alumna payment view: circle calendar markers, better photo framing, no logo over photo
          p = Path('alumno/pago.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('object-position:center 42%', 'object-position:center 30%')
          text = text.replace('.summary-logo{position:absolute;left:22px;top:20px;width:180px;z-index:2;filter:drop-shadow(0 8px 18px rgba(255,255,255,.75))}', '.summary-logo{display:none}')
          text = text.replace('.day.has-class{background:var(--green-mid);color:#fff;border-radius:50%}', '.day.has-class{background:var(--green-mid);color:#fff;border-radius:50%;width:33px;height:33px;margin:0 auto}')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes"
          else
            git add admin/gestion-administrativa.html alumno/pago.html
            git commit -m "Add admin history link and refine payment visual"
            git push
          fi
