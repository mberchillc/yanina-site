name: Patch student tracking measurements

on:
  push:
    paths:
      - 'scripts/patch_student_tracking_measurements.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run student tracking measurements patch
        run: python scripts/patch_student_tracking_measurements.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alumno/index.html
          git commit -m "Show Starfit history on student tracking"
          git push
