name: Update exercise library

on:
  push:
    paths:
      - 'scripts/generate_exercise_library.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate full exercise library
        run: python scripts/generate_exercise_library.py
      - name: Commit exercise library
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exercises.json
          git commit -m "Expand exercise library"
          git push
