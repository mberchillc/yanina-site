name: Patch exercise library UI

on:
  push:
    paths:
      - 'scripts/patch_exercise_library_ui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch exercise library UI
        run: python scripts/patch_exercise_library_ui.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/alumno.html alumno/index.html
          git commit -m "Connect exercise library to routines"
          git push
