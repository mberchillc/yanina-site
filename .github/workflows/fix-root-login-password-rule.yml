name: Fix root login password rule message

on:
  push:
    paths:
      - .github/workflows/fix-root-login-password-rule.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch root login password rule handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('login.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'throw new Error("La contrasena nueva debe ser alfanumerica y tener al menos 6 caracteres.");',
              'throw new Error("La contrasena nueva debe tener al menos 6 caracteres y usar solo letras y numeros.");'
          )
          marker = '''        } else if (message === "INVALID_SETUP_CODE") {
          setSetupMode(true);
          showError("El codigo no corresponde a ese usuario. Revisa el usuario y codigo exactos que te dio Yanina.");'''
          replacement = '''        } else if (message === "INVALID_SETUP_CODE") {
          setSetupMode(true);
          showError("El codigo no corresponde a ese usuario. Revisa el usuario y codigo exactos que te dio Yanina.");
        } else if (message === "PASSWORD_RULE_INVALID") {
          setSetupMode(true);
          showError("La contrasena nueva debe tener al menos 6 caracteres y usar solo letras y numeros.");'''
          if 'PASSWORD_RULE_INVALID' not in text:
              text = text.replace(marker, replacement)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched login
        run: |
          if git diff --quiet; then
            echo "No login changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add login.html
          git commit -m "Handle student password rule errors in login"
          git pull --rebase origin main
          git push
