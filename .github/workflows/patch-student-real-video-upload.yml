name: Patch student real video upload

on:
  push:
    paths:
      - patch-student-real-video-upload-trigger.txt
      - .github/workflows/patch-student-real-video-upload.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch alumno video upload
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('alumno/index.html')
          text=p.read_text(encoding='utf-8')
          old="if($('saveVideoBtn'))$('saveVideoBtn').addEventListener('click',()=>{if(!pendingVideoFile)return;const videos=getVideos();if(videos.length>=3)return alert('Ya enviaste 3 videos para esta clase.');videos.push({name:pendingVideoFile.name,size:fileSize(pendingVideoFile),note:$('videoNote')?.value||'',createdAt:new Date().toLocaleString('es-US')});setVideos(videos);pendingVideoFile=null;$('videoFile').value='';$('videoNote').value='';renderSelectedFile();renderVideos()});"
          new="if($('saveVideoBtn'))$('saveVideoBtn').addEventListener('click',async()=>{if(!pendingVideoFile)return;const videos=getVideos();if(videos.length>=3)return alert('Ya enviaste 3 videos para esta clase.');const btn=$('saveVideoBtn');const originalText=btn.textContent;btn.disabled=true;btn.textContent='Subiendo...';try{const formData=new FormData();formData.append('video',pendingVideoFile);formData.append('class_id',selectedId||'');formData.append('note',$('videoNote')?.value||'');const response=await fetch(`${API_BASE}/api/students/${encodeURIComponent(STUDENT_ID)}/videos`,{method:'POST',body:formData});if(!response.ok){const err=await response.json().catch(()=>({}));throw new Error(err.error||'No se pudo subir el video.')}const saved=await response.json();videos.push({id:saved.id,name:pendingVideoFile.name,size:fileSize(pendingVideoFile),note:$('videoNote')?.value||'',createdAt:new Date().toLocaleString('es-US'),remote:true});setVideos(videos);pendingVideoFile=null;$('videoFile').value='';$('videoNote').value='';renderSelectedFile();renderVideos();alert('Video enviado a Yanina.')}catch(error){console.error(error);alert(error.message||'No se pudo subir el video.')}finally{btn.disabled=false;btn.textContent=originalText}});"
          if old not in text:
              raise SystemExit('saveVideoBtn block not found')
          text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes"
          else
            git add alumno/index.html
            git commit -m "Connect student video upload to API"
            git push
          fi
# trigger run
