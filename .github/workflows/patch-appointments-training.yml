name: Patch appointments and training

on:
  push:
    paths:
      - 'scripts/patch_appointments_training.py'
      - 'scripts/trigger_appointments_training.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate patch script
        run: python -m py_compile scripts/patch_appointments_training.py
      - name: Patch appointment calendar and training page
        run: python scripts/patch_appointments_training.py
      - name: Validate generated pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          alumno = Path('admin/alumno.html').read_text(encoding='utf-8')
          training = Path('admin/entrenamiento.html').read_text(encoding='utf-8')
          assert 'YANINA_APPOINTMENT_MODAL_V2' in alumno
          assert 'id="appointmentModal"' in alumno
          assert 'entrenamiento.html' in alumno
          assert 'YANINA_TRAINING_PAGE_V2' in training
          assert '<title>Entrenamiento | Yanina Trainer</title>' in training
          assert '/api/classes/' in training
          assert 'Calendario de citas guardadas' in training

          for name, html in [('alumno', alumno), ('entrenamiento', training)]:
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
              assert scripts, f'No inline script found in {name}'
              Path(f'/tmp/{name}.js').write_text('\n'.join(scripts), encoding='utf-8')

          print('appointment/training pages validated')
          PY
          node --check /tmp/alumno.js
          node --check /tmp/entrenamiento.js
      - name: Record successful validation
        run: echo "validated $GITHUB_SHA" > scripts/appointment_validation_status.txt
      - name: Upload generated pages for verification
        uses: actions/upload-artifact@v4
        with:
          name: appointment-training-pages
          path: |
            admin/alumno.html
            admin/entrenamiento.html
          retention-days: 3
      - name: Commit generated pages and validation status
        run: |
          if git diff --quiet -- admin/alumno.html admin/entrenamiento.html scripts/appointment_validation_status.txt; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/alumno.html admin/entrenamiento.html scripts/appointment_validation_status.txt
          git commit -m "Validate appointment and training pages"
          git push
