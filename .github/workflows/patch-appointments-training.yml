name: Patch appointments and training

on:
  push:
    paths:
      - '.github/workflows/patch-appointments-training.yml'
      - 'scripts/patch_appointments_training.py'
      - 'scripts/patch_appointments_training_followup.py'
      - 'scripts/patch_appointments_training_final.py'
      - 'scripts/patch_appointment_time_dot_format.py'
      - 'scripts/trigger_appointments_training.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate patch scripts
        run: |
          python -m py_compile scripts/patch_appointments_training.py
          python -m py_compile scripts/patch_appointments_training_followup.py
          python -m py_compile scripts/patch_appointments_training_final.py
          python -m py_compile scripts/patch_appointment_time_dot_format.py

      - name: Patch appointment calendar and training page
        run: |
          python scripts/patch_appointments_training.py
          python scripts/patch_appointments_training_followup.py
          python scripts/patch_appointments_training_final.py
          python scripts/patch_appointment_time_dot_format.py

      - name: Validate generated pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          alumno = Path('admin/alumno.html').read_text(encoding='utf-8')
          training = Path('admin/entrenamiento.html').read_text(encoding='utf-8')

          required_alumno = [
              'YANINA_APPOINTMENT_MODAL_V2',
              'YANINA_APPOINTMENT_TRAINING_FOLLOWUP_V3',
              'YANINA_APPOINTMENT_TRAINING_FINAL_V4',
              'YANINA_APPOINTMENT_TIME_DOT_V5',
              'id="appointmentModal"',
              'id="appointmentDateInput" type="date" readonly',
              'id="appointmentTimeInput" type="text" inputmode="numeric"',
              'id="appointmentCommentsInput"',
              'id="appointmentSaveBtn">Guardar',
              'id="appointmentEditBtn">Editar',
              'id="appointmentDeleteBtn"',
              'id="createTrainingPlanBtn"',
              'let firstMonth = addMonths(base, -60);',
              'Primero guardá la ficha del alumno para crear una cita.',
              'const returnedClass = responseData?.class || responseData?.appointment || responseData;',
              'function normalizeAppointmentTime(value)',
              'formatAppointmentTime(appointment.class_time || "")',
          ]
          required_training = [
              'YANINA_TRAINING_PAGE_V2',
              'YANINA_APPOINTMENT_TRAINING_FOLLOWUP_V3',
              'YANINA_APPOINTMENT_TRAINING_FINAL_V4',
              '<title>Entrenamiento | Yanina Trainer</title>',
              '<small>Entrenamiento</small>',
              'Calendario de citas guardadas',
              'Guardar clase y rutina',
              'let firstMonth = addMonths(base, -60);',
              'calendarStartDate = startOfMonth(selectedDate);',
              'const classChanged = Boolean',
              'const currentClass = selectedClass?.id',
              'document.getElementById("notas-rutina").value = "";',
              'loadedRoutineSnapshot = currentRoutineSnapshot();',
              '/api/classes/',
              'id="classVideosAdmin"',
              'id="classCommentsAdmin"',
          ]

          for marker in required_alumno:
              assert marker in alumno, f'Missing alumno marker: {marker}'
          for marker in required_training:
              assert marker in training, f'Missing training marker: {marker}'

          hidden_measurement_sequence = (
              'await loadStudentFromBackend();\n'
              '        await loadMeasurementsFromBackend();\n'
              '        await loadClassesFromBackend();'
          )
          assert hidden_measurement_sequence not in training, 'Training page still loads hidden measurements before classes'

          for name, html in [('alumno', alumno), ('entrenamiento', training)]:
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
              assert scripts, f'No inline script found in {name}'
              Path(f'/tmp/{name}.js').write_text('\n'.join(scripts), encoding='utf-8')

          print('appointment/training pages validated')
          PY
          node --check /tmp/alumno.js
          node --check /tmp/entrenamiento.js

      - name: Record successful validation
        run: echo "validated $GITHUB_SHA" > scripts/appointment_validation_status.txt

      - name: Upload generated pages for verification
        uses: actions/upload-artifact@v4
        with:
          name: appointment-training-pages
          path: |
            admin/alumno.html
            admin/entrenamiento.html
          retention-days: 3

      - name: Commit generated pages and validation status
        run: |
          if git diff --quiet -- admin/alumno.html admin/entrenamiento.html scripts/appointment_validation_status.txt; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/alumno.html admin/entrenamiento.html scripts/appointment_validation_status.txt
          git commit -m "Apply strict hh.mm appointment time format"
          git push
