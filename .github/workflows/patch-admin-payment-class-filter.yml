name: Patch admin payment class filter

on:
  push:
    paths:
      - patch-admin-payment-class-filter-trigger.txt
      - .github/workflows/patch-admin-payment-class-filter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gestion administrativa class filter
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin/gestion-administrativa.html')
          text = p.read_text(encoding='utf-8')
          old = 'function monthClasses(){const{st,en}=bounds();return selectedClasses.filter(c=>{const d=pdate(c.class_date),status=String(c.status||"").toLowerCase();return d&&d>=st&&d<=en&&status!=="cancelled"})}'
          new = 'function normalizeStatus(status){return String(status||"draft").toLowerCase()}function isMeaningfulClass(c){if(!c)return false;const status=normalizeStatus(c.status);if(status==="cancelled")return false;const hasTime=Boolean(String(c.class_time||"").trim());const routine=String(c.routine_type||"").trim().toLowerCase();const hasCustomRoutine=Boolean(routine&&routine!=="nueva clase"&&routine!=="clase");const hasCriteria=Boolean(String(c.planning_criteria||"").trim());const hasRoutine=Boolean(c.has_routine);if(status&&status!=="draft")return true;return hasTime||hasCustomRoutine||hasCriteria||hasRoutine}function monthClasses(){const{st,en}=bounds();return selectedClasses.filter(c=>{const d=pdate(c.class_date);return d&&d>=st&&d<=en&&isMeaningfulClass(c)})}'
          if old not in text:
              raise SystemExit('monthClasses block not found')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes"
          else
            git add admin/gestion-administrativa.html
            git commit -m "Filter admin payment classes to saved classes"
            git push
          fi
# trigger run
