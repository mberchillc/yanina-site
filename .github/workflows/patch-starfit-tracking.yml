name: Patch Starfit tracking UI

on:
  push:
    paths:
      - '.github/workflows/patch-starfit-tracking.yml'
      - 'scripts/patch_starfit_tracking.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Starfit tracking patch
        run: python scripts/patch_starfit_tracking.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/alumno.html
          git commit -m "Add Starfit measurement tracking charts"
          git push
