<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin | Yanina Trainer</title>

  <style>
    :root {
      --green-dark: #183f35;
      --green-main: #7ec845;
      --green-soft: #d9f2cb;
      --cream: #f7f3ea;
      --white: #ffffff;
      --text: #24332e;
      --muted: #6f7d78;
      --border: rgba(24, 63, 53, 0.14);
      --shadow: 0 18px 50px rgba(24, 63, 53, 0.12);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--cream), #eef7ea);
      color: var(--text);
      min-height: 100vh;
    }

    .admin-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      background: var(--green-dark);
      color: var(--white);
      border-radius: 24px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand img {
      width: 300px;
      height: 100px;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .brand-text small {
      display: block;
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      margin-top: 3px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 11px 17px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.18s ease, opacity 0.18s ease;
      font-family: inherit;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .btn-primary {
      background: var(--green-main);
      color: var(--green-dark);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.24);
    }

    .btn-soft {
      background: var(--green-soft);
      color: var(--green-dark);
    }

    .page-header {
      margin-bottom: 22px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.05;
      color: var(--green-dark);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 17px;
      max-width: 720px;
      line-height: 1.5;
    }

    .dashboard-tools {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 22px;
    }

    .search-box {
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 14px 18px;
      font-size: 15px;
      width: 100%;
      outline: none;
      box-shadow: 0 10px 30px rgba(24, 63, 53, 0.06);
    }

    .search-box:focus {
      border-color: var(--green-main);
      box-shadow: 0 0 0 4px rgba(126, 200, 69, 0.18);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: var(--green-dark);
      color: var(--white);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .stat-card span {
      display: block;
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-card strong {
      display: block;
      font-size: 28px;
      color: var(--green-soft);
    }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .student-card {
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      display: grid;
      gap: 14px;
    }

    .student-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .student-name {
      color: var(--green-dark);
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
    }

    .student-pill {
      background: var(--green-soft);
      color: var(--green-dark);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .student-meta {
      display: grid;
      gap: 9px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .student-meta strong {
      color: var(--green-dark);
    }

    .next-class {
      background: rgba(217, 242, 203, 0.65);
      border: 1px solid rgba(126, 200, 69, 0.25);
      border-radius: 16px;
      padding: 13px;
      color: var(--green-dark);
      font-size: 14px;
      line-height: 1.4;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .empty-state {
      grid-column: 1 / -1;
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      color: var(--muted);
      line-height: 1.5;
    }

    @media (max-width: 900px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .dashboard-tools {
        grid-template-columns: 1fr;
      }

      .stats-grid,
      .students-grid {
        grid-template-columns: 1fr;
      }

      .brand img {
        width: 240px;
        height: 86px;
      }

      .admin-shell {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="admin-shell">

    <header class="topbar">
      <div class="brand">
        <img src="../assets/logo-transp.png" alt="Yanina Trainer" />
        <div class="brand-text">
          <strong>Admin Trainer</strong>
          <small>Panel de alumnos</small>
        </div>
      </div>

      <div class="top-actions">
        <a href="../index.html" class="btn btn-secondary">Volver al sitio</a>
        <button type="button" class="btn btn-secondary" id="logoutBtn">Salir</button>
        <a href="alumno.html?new=1" class="btn btn-primary">+ Nuevo alumno</a>
      </div>
    </header>

    <section class="page-header">
      <div class="eyebrow">Plataforma Yanina Trainer</div>
      <h1>Panel Admin</h1>
      <p class="subtitle">
        Buscá alumnos, abrí sus fichas y gestioná datos, clases y planes de entrenamiento desde una sola plataforma.
      </p>
    </section>

    <section class="dashboard-tools">
      <input
        class="search-box"
        id="studentSearchInput"
        type="search"
        placeholder="Buscar por nombre y/o apellido"
      />
      <button type="button" class="btn btn-primary" id="studentSearchBtn">Buscar</button>
    </section>

    <section class="stats-grid">
      <div class="stat-card">
        <span>Alumnos cargados</span>
        <strong id="studentsCount">—</strong>
      </div>

      <div class="stat-card">
        <span>Clases esta semana</span>
        <strong id="classesCount">—</strong>
      </div>

      <div class="stat-card">
        <span>Rutinas listas</span>
        <strong id="routinesCount">—</strong>
      </div>
    </section>

    <section class="students-grid" id="studentsGrid">
      <div class="empty-state">Cargando alumnos...</div>
    </section>

  </main>

  <script>
    const API_BASE = "https://yanina-trainer-api.mberchillc.workers.dev";
  const SESSION_KEY = "yaninaAdminSession";

if (!hasAdminSession()) {
  window.location.href = "login.html";
}

    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        localStorage.removeItem(SESSION_KEY);
        window.location.href = "login.html";
      });
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) return "—";

      const normalized = String(value).trim();

      if (/^\d{4}-\d{2}-\d{2}$/.test(normalized)) {
        const [year, month, day] = normalized.split("-");
        return `${day}/${month}/${year}`;
      }

      return normalized;
    }

    function renderStudents(list) {
      const grid = document.getElementById("studentsGrid");
      const studentsCount = document.getElementById("studentsCount");
      const classesCount = document.getElementById("classesCount");
      const routinesCount = document.getElementById("routinesCount");

      if (studentsCount) studentsCount.textContent = String(students.length);
      if (classesCount) classesCount.textContent = "—";
      if (routinesCount) routinesCount.textContent = "—";

      if (!grid) return;

      if (!list.length) {
        grid.innerHTML = `
          <div class="empty-state">
            No hay alumnos para mostrar. Usá el botón <strong>+ Nuevo alumno</strong> para cargar una ficha.
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(student => {
        const id = student.id;
        const name = escapeHtml(student.full_name || "Alumno sin nombre");
        const modality = escapeHtml(student.modality || "Sin modalidad");
        const goal = escapeHtml(student.goal || "Sin objetivo cargado");
        const frequency = escapeHtml(student.frequency || "Sin frecuencia");
        const lastMeasurements = escapeHtml(formatDate(student.last_measurements_date));

        return `
          <article class="student-card">
            <div class="student-top">
              <div class="student-name">${name}</div>
              <div class="student-pill">${modality}</div>
            </div>

            <div class="student-meta">
              <div><strong>Objetivo:</strong> ${goal}</div>
              <div><strong>Frecuencia:</strong> ${frequency}</div>
              <div><strong>Últimas mediciones:</strong> ${lastMeasurements}</div>
            </div>

            <div class="next-class">
              <strong>Próxima clase:</strong><br>
              Abrir calendario del alumno
            </div>

            <div class="card-actions">
              <a href="alumno.html?id=${id}" class="btn btn-soft">Ver ficha</a>
              <a href="alumno.html?id=${id}#calendario" class="btn btn-soft">Calendario</a>
            </div>
          </article>
        `;
      }).join("");
    }

    async function loadStudents() {
      const grid = document.getElementById("studentsGrid");

      try {
        const response = await fetch(`${API_BASE}/api/students?cache=${Date.now()}`);

        if (!response.ok) {
          throw new Error("No se pudo cargar la lista de alumnos");
        }

        const data = await response.json();
        students = Array.isArray(data) ? data : [];

        renderStudents(students);
      } catch (error) {
        console.error(error);

        if (grid) {
          grid.innerHTML = `
            <div class="empty-state">
              No se pudieron cargar los alumnos desde D1. Probá actualizar la página.
            </div>
          `;
        }
      }
    }

    function runSearch() {
      const input = document.getElementById("studentSearchInput");
      const query = (input?.value || "").trim().toLowerCase();

      if (!query) {
        renderStudents(students);
        return;
      }

      const filtered = students.filter(student => {
        return String(student.full_name || "").toLowerCase().includes(query);
      });

      renderStudents(filtered);
    }

    const searchInput = document.getElementById("studentSearchInput");
    const searchBtn = document.getElementById("studentSearchBtn");

    if (searchInput) {
      searchInput.addEventListener("input", runSearch);
      searchInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          runSearch();
        }
      });
    }

    if (searchBtn) {
      searchBtn.addEventListener("click", runSearch);
    }

    loadStudents();
  </script>
</body>
</html>
