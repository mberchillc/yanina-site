<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial administrativo | Yanina Trainer</title>
  <script>
    const SESSION_KEY = "yaninaAdminSession";
    const session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
    if (!session || session.loggedIn !== true) window.location.href = "login.html";
  </script>
  <style>
    :root{--green-dark:#183f35;--green-main:#7ec845;--green-mid:#6ea313;--green-soft:#d9f2cb;--cream:#f7f3ea;--white:#fff;--text:#24332e;--navy:#18223d;--muted:#6f7d78;--border:rgba(24,63,53,.14);--shadow:0 18px 50px rgba(24,63,53,.12);--radius:22px}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--cream),#eef7ea);color:var(--text);min-height:100vh}.admin-shell{max-width:1180px;margin:0 auto;padding:24px}.topbar{background:var(--green-dark);color:#fff;border-radius:24px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:var(--shadow);margin-bottom:26px}.brand{display:flex;align-items:center;gap:18px}.brand img{width:300px;height:100px;object-fit:cover;object-position:center;display:block}.brand-text small{display:block;color:rgba(255,255,255,.72);font-size:13px;margin-top:3px}.top-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;line-height:1.1}.btn-primary{background:var(--green-main);color:var(--green-dark)}.btn-secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.24)}.page-header{margin-bottom:22px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--green-dark);font-size:12px;font-weight:800;margin-bottom:8px}h1{font-size:clamp(30px,4vw,48px);line-height:1.05;color:var(--green-dark);margin-bottom:8px}.subtitle{color:var(--muted);font-size:17px;max-width:760px;line-height:1.5}.toolbar{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px;display:grid;grid-template-columns:minmax(240px,420px) auto;gap:14px;align-items:end}.field{display:grid;gap:7px}label{font-size:13px;color:var(--muted);font-weight:900}select{width:100%;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:14px;padding:13px 14px;font-size:15px;outline:0;font-family:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:0 14px 34px rgba(24,63,53,.08);padding:20px;display:grid;gap:12px}.card h3{color:var(--navy);font-size:22px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f3f8e9;border-radius:14px;padding:12px}.row span{color:var(--muted);font-weight:900;font-size:13px}.row strong{color:var(--green-mid);font-size:20px}.status{display:inline-flex;width:max-content;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.status.paid{background:#eef8f6;color:#173f35}.status.pending{background:#fff1dc;color:#9a5a00}.open{background:linear-gradient(135deg,#88b313,#6ea313);color:#fff;margin-top:4px}.empty{background:#fff;border:1px solid var(--border);border-radius:22px;padding:22px;color:var(--muted);box-shadow:var(--shadow)}@media(max-width:900px){.admin-shell{padding:16px}.topbar{align-items:flex-start;flex-direction:column}.top-actions{justify-content:flex-start}.brand img{width:240px;height:86px}.toolbar,.grid{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="../assets/catchdog-brand.css?v=20260611-final">
</head>
<body>
  <main class="admin-shell">
    <header class="topbar"><div class="brand"><img src="../assets/logo-transp.png" alt="Yanina Trainer"><div class="brand-text"><strong>Admin Trainer</strong><small>Historial administrativo</small></div></div><div class="top-actions"><a href="gestion-administrativa.html" class="btn btn-secondary">Gestión administrativa</a><a href="index.html" class="btn btn-primary">Panel Admin</a></div></header>
    <section class="page-header"><div class="eyebrow">Pagos y resúmenes</div><h1>Historial</h1><p class="subtitle">Consultá los resúmenes mensuales guardados por alumna, tanto pendientes como pagados.</p></section>
    <section class="toolbar"><div class="field"><label for="studentSelect">Alumna</label><select id="studentSelect"><option value="">Cargando alumnas...</option></select></div><a class="btn btn-primary" id="openStudentView" href="#">Ver como alumna</a></section>
    <section id="historyGrid" class="grid"><div class="empty">Elegí una alumna para ver su historial.</div></section>
  </main>
  <script>
    const API_BASE='https://yanina-trainer-api.mberchillc.workers.dev';
    const params=new URLSearchParams(location.search);const preselected=String(params.get('id')||params.get('studentId')||'');
    const studentSelect=document.getElementById('studentSelect'),historyGrid=document.getElementById('historyGrid'),openStudentView=document.getElementById('openStudentView');let students=[];
    function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
    function sid(s){return s.id||s.student_id||s.studentId||''}function sname(s){return s.full_name||s.name||'Alumna sin nombre'}
    function money(v){const n=Number(v||0);return `$${Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:0}):'0'}`}
    function monthName(value){const [y,m]=String(value).split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es-US',{month:'long',year:'numeric'})}
    function monthKeys(count=24){const now=new Date();const arr=[];for(let i=-1;i<count;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);arr.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`)}return [...new Set(arr)]}
    async function getSummary(studentId,month){try{const r=await fetch(`${API_BASE}/api/students/${encodeURIComponent(studentId)}/payment-summary?month=${encodeURIComponent(month)}&cache=${Date.now()}`);return r.ok?await r.json():null}catch(_){return null}}
    async function loadStudents(){const r=await fetch(`${API_BASE}/api/students?cache=${Date.now()}`);if(!r.ok)throw new Error('No se pudieron cargar alumnas');students=await r.json();students=Array.isArray(students)?students:[];studentSelect.innerHTML='<option value="">Seleccionar alumna</option>'+students.map(s=>`<option value="${esc(sid(s))}">${esc(sname(s))}</option>`).join('');if(preselected){studentSelect.value=preselected;await loadHistory(preselected)}}
    async function loadHistory(studentId){if(!studentId){historyGrid.innerHTML='<div class="empty">Elegí una alumna para ver su historial.</div>';openStudentView.href='#';return}openStudentView.href=`../alumno/historial-pagos.html?id=${encodeURIComponent(studentId)}`;historyGrid.innerHTML='<div class="empty">Cargando historial...</div>';const summaries=(await Promise.all(monthKeys().map(m=>getSummary(studentId,m)))).filter(Boolean);if(!summaries.length){historyGrid.innerHTML='<div class="empty">Todavía no hay resúmenes guardados para esta alumna.</div>';return}historyGrid.innerHTML=summaries.map(s=>{const month=s.month||'';const paid=s.status==='paid';return `<article class="card"><span class="status ${paid?'paid':'pending'}">${paid?'Pagado':'Pendiente'}</span><h3>${monthName(month)}</h3><div class="row"><span>Clases</span><strong>${s.classes_count??0}</strong></div><div class="row"><span>Valor por clase</span><strong>${money(s.class_value)}</strong></div><div class="row"><span>Otros</span><strong>${money(s.other_value)}</strong></div><div class="row"><span>Total mensual</span><strong>${money(s.total_value)}</strong></div><a class="btn open" href="../alumno/pago.html?id=${encodeURIComponent(studentId)}&month=${encodeURIComponent(month)}" target="_blank">Ver resumen</a></article>`}).join('')}
    studentSelect.addEventListener('change',()=>loadHistory(studentSelect.value));loadStudents().catch(e=>{console.error(e);studentSelect.innerHTML='<option value="">No se pudieron cargar alumnas</option>';historyGrid.innerHTML='<div class="empty">No se pudo cargar el historial.</div>'});
  </script>

  <div class="catchdog-platform-signature" aria-label="Powered by CatchDog" style="box-sizing:border-box;position:fixed;z-index:40;right:8px;bottom:max(8px,env(safe-area-inset-bottom));width:126px;max-width:calc(100vw - 16px);height:54px;padding:5px 7px;display:flex;align-items:center;justify-content:center;gap:5px;overflow:hidden;border:1px solid rgba(92,87,255,.30);border-radius:11px;background:linear-gradient(135deg,rgba(23,32,56,.97),rgba(5,6,8,.97));box-shadow:0 6px 18px rgba(5,6,8,.20);">
    <span style="display:block;flex:0 0 auto;font:800 6px/1 Inter,Montserrat,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.72);white-space:nowrap;">Powered by</span>
    <img src="../assets/catchdog-logo-light.png" alt="CatchDog - Work smarter" width="52" style="display:block;flex:0 0 52px;width:52px!important;max-width:52px!important;height:auto!important;max-height:44px;object-fit:contain;">
  </div>
</body>
</html>
