<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrenamiento | Yanina Trainer</title>
  <style>
    :root {
      --green-dark: #183f35;
      --green-main: #7ec845;
      --green-soft: #d9f2cb;
      --cream: #f7f3ea;
      --white: #ffffff;
      --text: #24332e;
      --muted: #6f7d78;
      --border: rgba(24, 63, 53, 0.14);
      --shadow: 0 18px 50px rgba(24, 63, 53, 0.12);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--cream), #eef7ea);
      color: var(--text);
      min-height: 100vh;
    }

    .admin-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      background: var(--green-dark);
      color: var(--white);
      border-radius: 24px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand img {
      width: 300px;
      height: 100px;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .brand-text small {
      display: block;
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      margin-top: 3px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 11px 17px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.18s ease, opacity 0.18s ease;
      font-family: inherit;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .btn-primary {
      background: var(--green-main);
      color: var(--green-dark);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.24);
    }

    .notification-bell {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      padding: 0;
      position: relative;
      font-size: 19px;
    }

    .notification-bell.has-unread {
      background: #fff1dc;
      color: #9a5a00;
      border-color: #f1cf96;
      box-shadow: 0 12px 26px rgba(154,90,0,0.18);
    }

    .notification-bell.has-unread::after {
      content: "";
      position: absolute;
      right: 7px;
      top: 7px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9a5a00;
    }

    .btn-form-primary {
      background: var(--green-dark);
      color: var(--white);
    }

    .btn-form-secondary {
      background: var(--green-soft);
      color: var(--green-dark);
    }

    .btn.is-saved {
      background: var(--green-soft);
      color: var(--green-dark);
    }

    .page-header {
      margin-bottom: 22px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.05;
      color: var(--green-dark);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 17px;
      max-width: 720px;
      line-height: 1.5;
    }

    .card {
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 22px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .card-title {
      font-size: 22px;
      color: var(--green-dark);
      font-weight: 800;
    }

    .card-subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
      line-height: 1.4;
    }

    .status-pill {
      background: var(--green-soft);
      color: var(--green-dark);
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-pill.completed {
      background: var(--green-dark);
      color: var(--white);
    }

    .status-pill.cancelled,
    .status-pill.pending {
      background: rgba(24, 63, 53, 0.12);
      color: var(--green-dark);
    }

    .status-pill.draft {
      background: rgba(217, 242, 203, 0.72);
      color: var(--green-dark);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 800;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--text);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.5;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--green-main);
      box-shadow: 0 0 0 4px rgba(126, 200, 69, 0.18);
    }

    .bottom-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .save-message {
      display: none;
      margin-top: 14px;
      padding: 13px 16px;
      border-radius: 16px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 14px;
      font-weight: 800;
    }

    .student-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 28px;
      padding: 12px;
      position: sticky;
      top: 12px;
      z-index: 20;
      background: rgba(247, 243, 234, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: 0 12px 34px rgba(24, 63, 53, 0.12);
      width: fit-content;
    }

    .student-nav-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px 6px 6px;
      border-radius: 999px;
      background: var(--green-dark);
      color: var(--white);
    }

    .student-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--green-main);
      color: var(--green-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
    }

    .student-nav-profile strong {
      display: block;
      font-size: 14px;
      line-height: 1.1;
    }

    .student-nav-profile span {
      display: block;
      color: rgba(255,255,255,0.7);
      font-size: 11px;
      margin-top: 2px;
    }

    .student-tab {
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 800;
      font-size: 14px;
      color: var(--green-dark);
      background: rgba(255,255,255,0.76);
      border: 1px solid var(--border);
      box-shadow: 0 10px 26px rgba(24, 63, 53, 0.08);
    }

    .student-tab:hover,
    .student-tab.active {
      background: var(--green-main);
      color: var(--green-dark);
      border-color: rgba(126, 200, 69, 0.6);
    }
.student-tab-arrow {
  width: 46px;
  padding: 12px 0;
  font-size: 20px;
  line-height: 1;
}
    #datos,
    #calendario,
    #plan,
    #mediciones,
    #calendario-mensual,
    #clase-seleccionada {
      scroll-margin-top: 110px;
    }

    .student-card-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 18px;
      align-items: center;
      margin-bottom: 22px;
    }

    .student-photo-block {
      display: grid;
      gap: 8px;
      justify-items: center;
    }

    .student-photo {
      width: 82px;
      height: 82px;
      border-radius: 24px;
      background: var(--green-soft);
      color: var(--green-dark);
      border: 1px solid rgba(126, 200, 69, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
    }

    .photo-btn {
      border: none;
      border-radius: 999px;
      background: rgba(24, 63, 53, 0.08);
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 800;
      padding: 7px 10px;
      cursor: pointer;
    }

    .calendar-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }

    .calendar-nav {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--white);
      color: var(--green-dark);
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
    }

    .calendar-month-select {
      width: auto;
      min-width: 220px;
      border-radius: 999px;
      padding: 11px 16px;
      font-weight: 800;
      color: var(--green-dark);
      background: var(--white);
    }

    .class-list {
      display: grid;
      gap: 14px;
    }

    .class-item {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 16px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
    }

    .class-date {
      background: var(--green-soft);
      color: var(--green-dark);
      border-radius: 16px;
      min-height: 88px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .class-date strong {
      font-size: 15px;
    }

    .class-date span {
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
    }

    .class-info p {
      color: var(--muted);
      line-height: 1.5;
      margin-top: 8px;
    }

    .class-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .class-topline strong {
      color: var(--green-dark);
      font-size: 18px;
    }

    .class-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .plan-timeline {
      margin-bottom: 24px;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      background: rgba(247, 243, 234, 0.55);
    }

    .plan-timeline-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .plan-timeline-header h3 {
      color: var(--green-dark);
      font-size: 20px;
      margin-bottom: 5px;
    }

    .plan-timeline-header p {
      color: var(--muted);
      font-size: 14px;
    }

    .timeline-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(110px, 1fr));
      gap: 8px;
      overflow: visible;
      padding-bottom: 8px;
    }

    .timeline-weekday {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 6px 0;
    }

    .timeline-day {
      min-height: 122px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
      padding: 10px;
      text-align: left;
      color: var(--text);
      font-family: inherit;
    }

    .timeline-day span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .timeline-day strong {
      display: block;
      color: var(--green-dark);
      font-size: 20px;
      margin-bottom: 5px;
    }

    .timeline-day em {
      display: block;
      color: var(--green-dark);
      font-style: normal;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .timeline-day small {
      display: block;
      color: var(--text);
      font-size: 11px;
      line-height: 1.25;
    }

    .timeline-day.has-class {
      cursor: pointer;
      background: var(--green-soft);
      border-color: rgba(126, 200, 69, 0.7);
    }

    .timeline-day.has-class.no-routine {
      background: rgba(217, 242, 203, 0.72);
    }

    .timeline-day.is-selectable {
      cursor: pointer;
    }

    .timeline-day.is-outside {
      opacity: 0.38;
      background: rgba(255,255,255,0.42);
    }

    .timeline-day.is-empty {
      background: rgba(255,255,255,0.74);
    }

    .timeline-day .slot-action {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
      margin-top: 8px;
    }

    .slot-time-input {
      width: 100%;
      margin-top: 8px;
      padding: 8px 9px;
      border-radius: 12px;
      border: 1px solid rgba(24, 63, 53, 0.18);
      background: rgba(255,255,255,0.86);
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 800;
    }

    .timeline-day.has-class.is-active {
      outline: 3px solid rgba(126, 200, 69, 0.35);
      background: var(--green-main);
    }

    .selected-class-panel {
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      background: rgba(255,255,255,0.76);
      margin-bottom: 22px;
    }

    .selected-class-panel h3 {
      color: var(--green-dark);
      font-size: 20px;
      margin-bottom: 14px;
    }

    .class-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .class-form-grid .field.full {
      grid-column: 1 / -1;
    }

    .routine-section-title {
      color: var(--green-dark);
      font-size: 20px;
      font-weight: 900;
      margin: 6px 0 14px;
    }

    .exercise-table {
      display: grid;
      gap: 8px;
    }

    .exercise-head,
    .exercise-row {
