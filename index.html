<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yanina Trainer & Nutrition Coach</title>
  <meta name="description" content="Entrenamiento personal, alimentación consciente y acompañamiento para construir hábitos saludables y sostenibles." />
  
  <style>
    /* =========================================
       VARIABLES Y FUENTES
       ========================================= */
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Pacifico&display=swap');

    :root {
      --green: #78ad23;
      --green-dark: #1f6f48;
      --navy: #1d2a44;
      --text: #354056;
      --soft: #f6fbf6;
      --yellow: #f4da2c;
      --shadow: 0 18px 40px rgba(31,50,68,.10);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { 
      margin: 0; 
      font-family: 'Montserrat', system-ui, sans-serif; 
      color: var(--text); 
      background: #fff; 
    }
    img { max-width: 100%; display: block; height: auto; }
    a { text-decoration: none; color: inherit; }
    
    .section-pad { padding: 90px 6vw; }

    /* =========================================
       HEADER Y NAVEGACIÓN
       ========================================= */
    .site-header {
      position: sticky; 
      top: 0; 
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      padding: 0 6vw;
      min-height: 120px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    /* Fondo verde oscuro y logo más grande */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 35% 28%, #1f6f48 0%, #14555b 48%, #083a40 100%);
      padding: 20px 40px 30px 6vw;
      margin-left: -6vw;
      align-self: flex-start;
      border-radius: 0 0 100px 30px;
      box-shadow: 0 18px 38px rgba(8,58,64,.28);
      height: 160px;
      width: 340px;
    }

    .brand img {
      width: 100%;
      max-width: 260px; /* Aumentado para que ocupe más espacio */
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.24));
    }

    .main-nav {
      display: flex; 
      gap: 15px; 
      align-items: center;
    }

    .main-nav a {
      font-weight: 800; 
      font-size: 13px; 
      text-transform: uppercase;
      color: var(--navy);
      padding: 10px 20px; 
      border-radius: 999px;
      transition: all 0.3s ease;
    }

    .main-nav a:hover {
      color: var(--green); 
      background: #f0f7e6;
    }

    /* Botones */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px; padding: 15px 28px;
      font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #fff;
      box-shadow: 0 10px 22px rgba(120,173,35,.25);
    }
    .btn-outline {
      border: 2px solid var(--green);
      color: var(--green-dark);
      background: #fff;
    }

    /* =========================================
       HERO SECTION
       ========================================= */
    .hero {
      min-height: 80vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 40px;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: ""; position: absolute; right: -8%; bottom: 7%;
      width: 58%; height: 36%; background: linear-gradient(135deg,#cdebdc,#83c8b7);
      border-radius: 70% 0 0 0; z-index: -2;
    }
    .hero::before {
      content: ""; position: absolute; right: 8%; top: 18%;
      width: 420px; height: 420px; background: #e9f7fb;
      border-radius: 50%; z-index: -3;
    }

    .hero-copy { z-index: 2; }
    .eyebrow { font-weight: 800; color: #53b499; margin: 0 0 20px; }
    .eyebrow::before { content: "🍃 "; margin-right: 8px; color: var(--green); }
