<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yanina Trainer & Nutrition Coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #78ad23;
      --green-dark: #083a40; /* Verde oscuro para el blob */
      --navy: #1d2a44;
      --mint: #dff2e8;
      --soft: #f6fbf6;
      --text: #354056;
      --shadow: 0 18px 40px rgba(31,50,68,.10);
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Montserrat', sans-serif; color: var(--text); background: #fff; }
    
    /* HEADER & BLOB QUIRÚRGICO */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6vw;
      min-height: 120px;
    }

    .brand {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 26px 42px 34px 78px;
      margin-left: -6vw;
      background: radial-gradient(circle at 35% 28%, #1f6f48 0%, #14555b 48%, #083a40 100%);
      border-radius: 0 0 150px 0;
      box-shadow: 0 18px 38px rgba(8,58,64,0.28);
    }

    .brand img {
      width: 245px !important;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.24));
    }

    .main-nav { display: flex; gap: 15px; }
    .main-nav a {
      padding: 10px 20px;
      border-radius: 50px;
      border: 2px solid var(--green);
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--green);
      transition: 0.3s;
    }
    .main-nav a:hover { background: var(--green); color: #fff; }

    /* HERO */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      background: var(--soft);
      overflow: hidden;
      padding: 60px 7vw;
    }
    .hero-content h1 { font-size: 4rem; color: var(--navy); line-height: 1.1; }
    .hero-content span { color: var(--green); }
    .hero-image { display: flex; justify-content: flex-end; }
    .hero-image img { width: 90%; height: auto; }

    /* SERVICIOS & ICONOS */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      padding: 80px 7vw;
    }
    .service-card {
      background: #fff;
      padding: 40px;
      border-radius: 30px;
      box-shadow: var(--shadow);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-container {
      width: 100px;
      height: 100px;
      background: var(--mint);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .icon-container img { width: 60%; height: auto; }

    .yanina-brand { font-family: 'Pacifico', cursive; color: var(--green); }

    @media (max-width: 768px) {
      .hero { grid-template-columns: 1fr; text-align: center; }
      .brand { width: 220px; padding: 20px 30px; }
      .brand img { width: 150px !important; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a class="brand" href="#">
      <img src="assets/logo-transp.png" alt="Logo Yanina">
    </a>
    <nav class="main-nav">
      <a href="#servicios">Servicios</a>
      <a href="#sobre-mi">Sobre mí</a>
    </nav>
    <a style="background: var(--green); color: white;" class="main-nav a" href="#">Comencemos</a>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Haz lo que <br><span>te hace bien</span></h1>
        <p>Acompañamiento personalizado por <strong class="yanina-brand">Yanina</strong>.</p>
      </div>
      <div class="hero-image">
        <img src="assets/yani-sf-hero.png" alt="Yanina Trainer">
      </div>
    </section>

    <section id="servicios" class="services-grid">
      <article class="service-card">
        <div class="icon-container">
          <img src="assets/iconos-yani-sinte.png" alt="Icono Entrenamiento">
        </div>
        <h3>Entrenamiento</h3>
        <p>Planes adaptados a tu ritmo.</p>
      </article>
      <article class="service-card">
        <div class="icon-container">
          <img src="assets/iconos-yani-2.png" alt="Icono Nutrición">
        </div>
        <h3>Nutrición</h3>
        <p>Aprende a comer sin culpas.</p>
      </article>
      <article class="service-card">
        <div class="icon-container">
          <img src="assets/logo-transp.png" alt="Icono Seguimiento">
        </div>
        <h3>Seguimiento</h3>
        <p>Juntas en cada paso.</p>
      </article>
    </section>
  </main>

</body>
</html>
