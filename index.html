<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yanina Trainer & Nutrition Coach</title>
  <meta name="description" content="Entrenamiento personal, alimentación consciente y acompañamiento para construir hábitos saludables y sostenibles." />
  <style>
    /* Estilos base del documento original */
    :root {
      --green: #78ad23;
      --green-dark: #5f9419;
      --navy: #1d2a44;
      --blue: #8fd0e7;
      --mint: #dff2e8;
      --soft: #f6fbf6;
      --yellow: #f4da2c;
      --text: #354056;
      --shadow: 0 18px 40px rgba(31,50,68,.10);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: Montserrat, system-ui, sans-serif; color: var(--text); background: #fff; }
    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }
    .section-pad { padding: 90px 7vw; }

    /* HEADER Y MARCA */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 6vw;
    }

    /* AJUSTE 1: MARCA MÁS GRANDE */
    .brand img {
      width: 280px; /* Tamaño aumentado */
      height: auto;
    }

    .nav { display: flex; gap: 42px; font-weight: 700; text-transform: uppercase; font-size: 13px; color: var(--navy); }
    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 15px 28px; font-size: 13px; font-weight: 800; text-transform: uppercase; }
    .btn-primary { background: linear-gradient(135deg,var(--green),var(--green-dark)); color: #fff; }

    /* HERO SECTION */
    .hero { min-height: 760px; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 40px; position: relative; overflow: hidden; }
    h1 { font-size: clamp(52px,7vw,96px); line-height: .98; text-transform: uppercase; }
    h1 span { color: var(--green); }
    .hero-image img { max-height: 700px; margin: auto; object-fit: contain; }

    /* AJUSTE 2: ICONOS CENTRADOS EN CÍRCULOS */
    .service-icon, .icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #e7f2f1;
      display: flex; /* Cambiado a flex para centrado total */
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .service-icon img, .pillars article img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    /* SERVICIOS */
    .service-list { display: grid; gap: 26px; }
    .service-card {
      display: grid;
      grid-template-columns: 120px 1fr 300px;
      gap: 30px;
      align-items: center;
      background: #fff;
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 22px 22px 22px 34px;
    }

    /* AJUSTE 3: MOBILE AJUSTADO A PANTALLA VERTICAL */
    @media (max-width: 900px) {
      .site-header { flex-direction: column; gap: 20px; padding: 20px; }
      .brand img { width: 200px; }
      .nav { width: 100%; justify-content: center; gap: 15px; }
      .hero { grid-template-columns: 1fr; padding-top: 50px; text-align: center; }
      .hero-image { order: -1; }
      .service-card { grid-template-columns: 1fr; text-align: center; justify-items: center; }
      .pillars { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#">
      <img src="marca%20yani%20fdo%20transp.png" alt="Yanina Trainer">
    </a>
    <nav class="nav">
      <a href="#servicios">Servicios</a>
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#contacto">Contacto</a>
    </nav>
    <a href="#" class="btn btn-primary">Comencemos</a>
  </header>

  <main>
    <section class="hero section-pad">
      <div class="hero-content">
        <h1>Haz lo que <span>te hace bien</span></h1>
        <p>Entrenamiento personal y nutrición integral.</p>
      </div>
      <div class="hero-image">
        <img src="yani-sf-hero.jpg" alt="Yanina">
      </div>
    </section>

    <section id="servicios" class="section-pad">
      <div class="service-list">
        <article class="service-card">
          <div class="service-icon">
            <img src="iconos-yani-2.png" alt="Icono">
          </div>
          <div>
            <h3>Seguimiento</h3>
            <p>Acompañamiento constante en tu proceso.</p>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
