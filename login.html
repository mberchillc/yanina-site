<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso | Yanina Trainer</title>
  <style>
    :root{--green-dark:#183f35;--green-main:#7ec845;--green-soft:#d9f2cb;--cream:#f7f3ea;--white:#fff;--text:#24332e;--muted:#6f7d78;--border:rgba(24,63,53,.14);--shadow:0 18px 50px rgba(24,63,53,.14)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--cream),#eef7ea);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px}
    .login-card{width:100%;max-width:460px;background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow);padding:34px}
    .brand-block{background:var(--green-dark);border-radius:24px;padding:28px;text-align:center;margin-bottom:28px}.brand-block img{width:260px;height:92px;object-fit:cover;object-position:center;display:block;margin:0 auto}
    .eyebrow{color:var(--green-dark);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}h1{color:var(--green-dark);font-size:34px;line-height:1.08;margin-bottom:24px}
    .mode-switch{display:flex;gap:10px;margin-bottom:18px}.mode-switch button{flex:1;border:1px solid var(--border);background:#fff;border-radius:999px;padding:12px 13px;color:var(--green-dark);font-weight:900;cursor:pointer;min-height:42px;white-space:nowrap}.mode-switch button.active{background:var(--green-main);border-color:var(--green-main)}
    .field{display:grid;gap:7px;margin-bottom:16px}label{color:var(--muted);font-size:13px;font-weight:800}input{width:100%;border:1px solid var(--border);background:var(--white);color:var(--text);border-radius:14px;padding:14px;font-size:15px;outline:none}input:focus{border-color:var(--green-main);box-shadow:0 0 0 4px rgba(126,200,69,.18)}
    .btn{width:100%;border:none;border-radius:999px;padding:14px 18px;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;margin-top:8px}.btn-primary{background:var(--green-main);color:var(--green-dark)}.btn:disabled{opacity:.55;cursor:not-allowed}
    .back-link{display:block;text-align:center;margin-top:18px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:700}.back-link:hover{color:var(--green-dark)}.note{margin-top:18px;padding:13px 14px;border-radius:16px;background:var(--green-soft);color:var(--green-dark);font-size:13px;line-height:1.45}.login-error,.login-success{display:none;margin:0 0 16px;padding:12px 14px;border-radius:16px;font-size:13px;font-weight:800;line-height:1.4}.login-error{background:rgba(180,48,48,.1);color:#8f2525}.login-success{background:var(--green-soft);color:var(--green-dark)}.hidden{display:none}
    @media(max-width:520px){body{align-items:flex-start;padding:12px}.login-card{padding:24px}.brand-block{margin-bottom:22px}.brand-block img{width:220px;height:82px}h1{font-size:30px;margin-bottom:18px}.mode-switch{display:flex;flex-direction:row;gap:10px}.mode-switch button{font-size:14px;padding:11px 10px}}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand-block"><img src="assets/logo-transp.png" alt="Yanina Trainer" /></div>
    <div class="eyebrow">Plataforma Yanina Trainer</div>
    <h1>Acceso</h1>

    <div class="mode-switch">
      <button type="button" id="loginModeBtn" class="active">Entrar</button>
      <button type="button" id="setupModeBtn">Crear contrasena</button>
    </div>

    <div class="login-error" id="loginError">Usuario o contrasena incorrectos.</div>
    <div class="login-success" id="loginSuccess">Contrasena creada. Ya podes entrar.</div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" type="text" placeholder="Usuario" autocomplete="username" autocapitalize="none" />
      </div>

      <div class="field">
        <label for="password">Contrasena</label>
        <input id="password" type="password" placeholder="Contrasena" autocomplete="current-password" />
      </div>

      <div class="field hidden" id="confirmPasswordField">
        <label for="confirmPassword">Repetir contrasena</label>
        <input id="confirmPassword" type="password" placeholder="Repetir contrasena" autocomplete="new-password" />
      </div>

      <div class="field hidden" id="setupCodeField">
        <label for="setupCode">Codigo de Yanina</label>
        <input id="setupCode" type="text" placeholder="Codigo de acceso" autocomplete="one-time-code" autocapitalize="characters" />
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">Entrar a plataforma</button>
    </form>

    <div class="note" id="loginNote">Ingresa con tu usuario y contrasena.</div>
    <a class="back-link" href="/">Volver al sitio</a>
  </main>

  <script>
    const API_BASE = "https://yanina-trainer-api.mberchillc.workers.dev";
    const ADMIN_SESSION_KEY = "yaninaAdminSession";
    const STUDENT_SESSION_KEY = "yaninaStudentSession";

    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const loginSuccess = document.getElementById("loginSuccess");
    const confirmPasswordField = document.getElementById("confirmPasswordField");
    const setupCodeField = document.getElementById("setupCodeField");
    const submitBtn = document.getElementById("submitBtn");
    const loginNote = document.getElementById("loginNote");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const setupCodeInput = document.getElementById("setupCode");
    const loginModeBtn = document.getElementById("loginModeBtn");
    const setupModeBtn = document.getElementById("setupModeBtn");

    let setupMode = false;

    function normalizeUser(value) { return String(value || "").trim(); }
    function validNewPassword(value) { return /^[A-Za-z0-9]{6,}$/.test(String(value || "")); }
    function showError(message) { loginSuccess.style.display = "none"; loginError.textContent = message; loginError.style.display = "block"; }
    function showSuccess(message) { loginError.style.display = "none"; loginSuccess.textContent = message; loginSuccess.style.display = "block"; }
    function setLoading(active) { submitBtn.disabled = active; submitBtn.textContent = active ? "Validando..." : (setupMode ? "Crear contrasena" : "Entrar a plataforma"); }

    function setSetupMode(active) {
      setupMode = active;
      loginError.style.display = "none";
      loginSuccess.style.display = "none";
      loginModeBtn.classList.toggle("active", !active);
      setupModeBtn.classList.toggle("active", active);
      confirmPasswordField.classList.toggle("hidden", !active);
      setupCodeField.classList.toggle("hidden", !active);
      submitBtn.textContent = active ? "Crear contrasena" : "Entrar a plataforma";
      passwordInput.value = "";
      confirmPasswordInput.value = "";
      setupCodeInput.value = "";
      passwordInput.autocomplete = active ? "new-password" : "current-password";
      loginNote.innerHTML = active
        ? "Usa el usuario y el codigo que te dio Yanina. Solo pueden crear contrasena las alumnas con ficha guardada."
        : "Ingresa con tu usuario y contrasena.";
    }

    async function postAuth(path, payload) {
      const response = await fetch(`${API_BASE}${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "No se pudo validar el acceso.");
      return data;
    }

    function enterAdmin(payload) {
      localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ user: payload.username, role: "admin", token: payload.token || "", loggedIn: true, createdAt: new Date().toISOString() }));
      window.location.href = "/admin/index.html";
    }

    function enterStudent(payload) {
      localStorage.setItem(STUDENT_SESSION_KEY, JSON.stringify({ role: "student", studentId: payload.student_id, name: payload.name || "Alumna", username: payload.username, token: payload.token || "", loggedIn: true, createdAt: new Date().toISOString() }));
      window.location.href = "/alumno/index.html?v=tracking-back";
    }

    loginModeBtn.addEventListener("click", () => setSetupMode(false));
    setupModeBtn.addEventListener("click", () => setSetupMode(true));
    usernameInput.addEventListener("input", () => { loginError.style.display = "none"; loginSuccess.style.display = "none"; });

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      const username = normalizeUser(usernameInput.value);
      const password = passwordInput.value || "";
      const confirmPassword = confirmPasswordInput.value || "";
      const setupCode = String(setupCodeInput.value || "").trim();

      if (!username) { showError("Completa usuario."); return; }

      try {
        setLoading(true);
        if (setupMode) {
          if (!validNewPassword(password)) throw new Error("La contrasena nueva debe ser alfanumerica y tener al menos 6 caracteres.");
          if (password !== confirmPassword) throw new Error("Las contrasenas no coinciden.");
          if (!setupCode) throw new Error("Ingresa el codigo que te dio Yanina.");
          await postAuth("/api/student-auth/setup-password", { username, password, setup_code: setupCode });
          showSuccess("Contrasena creada. Ya podes entrar.");
          setSetupMode(false);
          return;
        }

        if (!password) throw new Error("Completa usuario y contrasena.");
        const payload = await postAuth("/api/auth/login", { username, password });
        if (payload.role === "admin") { enterAdmin(payload); return; }
        if (payload.role === "student") { enterStudent(payload); return; }
        throw new Error("Usuario o contrasena incorrectos.");
      } catch (error) {
        const message = String(error.message || "No se pudo validar el acceso.");
        if (message === "PASSWORD_NOT_SET") {
          setSetupMode(true);
          showError("Tu ficha existe, pero todavia no creaste contrasena. Usa Crear contrasena con el codigo de Yanina.");
        } else if (message === "PASSWORD_ALREADY_SET") {
          setSetupMode(false);
          showError("Ese usuario ya tiene contrasena. Usa Entrar.");
        } else if (message === "SETUP_CODE_REQUIRED" || message === "INVALID_SETUP_CODE") {
          showError("El codigo no corresponde a ese usuario. Revisa el usuario y codigo exactos que te dio Yanina.");
        } else if (message === "Student account not found") {
          showError("No existe una ficha guardada para ese usuario. Yanina debe crear y guardar la ficha antes de que puedas crear contrasena.");
        } else if (message === "Invalid username or password") {
          showError("Usuario o contrasena incorrectos. Si es tu primer ingreso, usa Crear contrasena con el codigo de Yanina.");
        } else {
          showError(message);
        }
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
